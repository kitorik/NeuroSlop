name: Build JAI Mod

on:
  push:
    paths: ["mod/**", ".github/workflows/build-mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      # Java 25 — для ЗАПУСКА Gradle/Loom 1.19 (он требует JVM >= 25).
      # Сам мод компилируется под Java 21 (options.release = 21 в build.gradle).
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jaimod
          path: mod/build/libs/*.jar
